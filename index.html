import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='https://yravumqntnixbfnkmxef.supabase.co';
const KEY='sb_publishable_QIRWVuGx2BNCqft2VZ2Bbw_eCOJaSb7';

const sb=createClient(URL,KEY);

async function load(){
  const {data:{user:u}}=await sb.auth.getUser();user=u;admin=u?.id===ADMIN;

async function loadHistory(){const {data,error}=await sb.from('trip_history').select('id,itinerary_id,old_content,new_content,changed_at').eq('itinerary_id','main').order('id',{ascending:false}).limit(100);if(!error)history=data||[];}
async function save(label){if(!admin||busy)return;busy=true;msg('正在保存到云端…');const {error}=await sb.from('trip_itinerary').upsert({id:'main',content:{days}},{onConflict:'id'});busy=false;if(error){msg('保存失败：'+error.message+'（请刷新页面检查）');alert('保存失败，请复制修改内容备份后刷新：'+error.message);return;}msg('云端保存成功 · '+new Date().toLocaleString());await loadHistory();render();}

function renderDay(){const d=days[day];$('content').innerHTML=`<section class="panel"><h2>Day ${day+1} · ${esc(d.date)}</h2><p>${esc(d.headline)}</p><div class="meta">交通：${esc(d.transport)} ｜ 酒店：${esc(d.hotel)}</div>${day===3?'<div class="warn">太鲁阁与清水断崖周边道路需出发前重新核查官方公告，不保证通行。</div>':''}${day===4?'<div class="warn">三仙台八拱桥施工，不能按原计划跨桥；本日时间也需重排。</div>':''}${day===5||day===7?'<div class="warn">原行车时间过紧，暂非最终可执行时刻表。</div>':''}<div class="actions"><button class="owner-only" id="add">＋ 添加行程</button><a href="${maps(d.hotel+' 台湾')}" target="_blank" rel="noopener">酒店地图 ↗</a><a href="https://168.thb.gov.tw/" target="_blank" rel="noopener">公路实时资讯 ↗</a></div></section><section class="panel"><h3>逐站安排 ${admin?'· 修改后自动保存':'· 家人只读'}</h3>${d.stops.map((s,i)=>`<div class="stop"><div><input class="edit time" data-i="${i}" data-k="time" value="${esc(s.time)}" ${admin?'':'readonly'}></div><div><textarea class="edit" data-i="${i}" data-k="title" ${admin?'':'readonly'}>${esc(s.title)}</textarea><div class="actions"><select class="edit" style="width:auto" data-i="${i}" data-k="status" ${admin?'':'disabled'}>${['无需预订','未预订','已预订','待确认','已取消'].map(x=>`<option ${x===s.status?'selected':''}>${x}</option>`).join('')}</select><a target="_blank" rel="noopener" href="${maps(s.title)}">地图 ↗</a><button class="owner-only" data-remove="${i}">删除</button></div><input class="edit" data-i="${i}" data-k="note" placeholder="公开备注（不要填订单号或私人信息）" value="${esc(s.note)}" ${admin?'':'readonly'}></div></div>`).join('')}</section><section class="panel"><h3>当天地图</h3><iframe class="map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="${frame(d.hotel+' 台湾')}"></iframe><p class="small">地图显示酒店位置；每个景点点击“地图”可在 Google Maps 打开。</p></section>`;

function renderHistory(){$('content').innerHTML=`<section class="panel"><h2>云端修改历史</h2>${admin?'<p class="small">最多显示最近100条数据库版本；恢复会产生一条新版本。</p>':'<p>修改历史仅管理员可查看。</p>'}${admin?history.map(h=>`<div class="history"><b>${esc(new Date(h.changed_at).toLocaleString())}</b><p>版本 #${h.id}</p><button data-restore="${h.id}">恢复到此版本</button></div>`).join('')||'暂无历史':''}</section>`;document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=async()=>{const h=history.find(x=>x.id===+b.dataset.restore);if(!h||!confirm('恢复此版本？将覆盖当前行程并留下新历史。'))return;days=structuredClone(h.new_content.days||h.new_content);await save('恢复')});}
function renderSettings(){$('content').innerHTML=`<section class="panel"><h2>账号与云端状态</h2><p>项目：台湾家庭旅行 · Supabase 云端同步</p><p>${admin?'当前：管理员已登录':user?'当前账号无编辑权限':'当前：访客只读'}</p>${user?'<button id="logout">退出登录</button>':`<div class="loginbox"><label>管理员邮箱<input id="email" type="email" autocomplete="username"></label><label>密码<input id="password" type="password" autocomplete="current-password"></label><button class="primary" id="login">登录以编辑</button></div>`}<hr>${admin?'<button id="seedImport">首次导入原始9天行程（仅数据库为空时）</button> <button id="export">下载云端行程备份</button>':'<p class="small">家人不需要登录即可查看。</p>'}<p class="warn">行程及备注属于公开数据。不要填写机票订单号、酒店确认码、护照、电话或私人信息。</p></section>`;
if(user)$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};else $('login').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)alert(error.message);else location.reload()};

['overview','booking','history','settings'].forEach(v=>$(v+'Btn').onclick=()=>setView(v));
render();load();
