: ""}, {"time": "14:00", "title": "永康街：慢慢逛周边小店（约1.5小时），顺路吃思慕昔 Smoothie House 的芒果冰（永康街上，甜品必吃）；备选：大安站转文湖线到动物园站约15分钟，若想去猫空缆车可以这里插入，来回约1.5-2小时，会挤掉后面的购物时间", "status": "无需预订", "note": ""}, {"time": "15:30", "title": "诚品生活南西 或 新光三越南西：伴手礼、精品一次买齐（约2小时）", "status": "无需预订", "note": ""}, {"time": "17:30", "title": "宁夏夜市：晚餐＋采购（离南西商圈近，顺路）", "status": "无需预订", "note": ""}]}, {"day": 9, "date": "2026-12-17", "headline": "从容收拾，前往桃园机场，15:35 起飞", "transport": "捷运", "hotel": "返程", "stops": [{"time": "08:30", "title": "起床，从容吃早餐（台北中山意舍酒店含早餐）、收拾行李（伴手礼Day1和Day8都买过了，这天不用再专程购物）", "status": "无需预订", "note": ""}, {"time": "09:30", "title": "如果还想再逛逛，可以到酒店附近随意走走；不想动就直接休息，留点弹性时间", "status": "无需预订", "note": ""}, {"time": "10:30", "title": "捷运前往桃园机场（约40-50分钟）", "status": "无需预订", "note": ""}, {"time": "12:00", "title": "抵达机场，办理登机手续，逛免税店可再补买凤梨酥", "status": "无需预订", "note": ""}, {"time": "15:35", "title": "起飞", "status": "无需预订", "note": ""}]}]</script><script>
const SEED=JSON.parse(document.getElementById('seed').textContent);const KEY='taiwan-trip-v2';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{days:SEED,history:[],updated:null};let day=0,view='overview',cloud=null,cloudConfig=JSON.parse(localStorage.getItem('taiwan-cloud-config')||'null');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(action){state.updated=new Date().toISOString();state.history.unshift({at:state.updated,action,snapshot:JSON.stringify(state.days)});state.history=state.history.slice(0,100);localStorage.setItem(KEY,JSON.stringify(state));if(cloud)sync();render()}
async function initCloud(){if(!cloudConfig?.url||!cloudConfig?.key||!cloudConfig?.code){$('banner').textContent='本机保存模式 · 尚未启用跨设备同步';return}try{const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');cloud=mod.createClient(cloudConfig.url,cloudConfig.key);const {data,error}=await cloud.from('trip_documents').select('payload').eq('code',cloudConfig.code).maybeSingle();if(error)throw error;if(data?.payload){state=data.payload;localStorage.setItem(KEY,JSON.stringify(state))}else await sync();$('banner').textContent='云端已连接 · 修改将同步';render()}catch(e){$('banner').textContent='云端连接失败，本机保存中：'+e.message}}
async function sync(){if(!cloud)return;const {error}=await cloud.from('trip_documents').upsert({code:cloudConfig.code,payload:state,updated_at:new Date().toISOString()});if(error){$('banner').textContent='云端保存失败：'+error.message}else $('banner').textContent='云端已同步 · '+new Date().toLocaleString()}
function gmaps(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}
function mapFrame(q){return 'https://maps.google.com/maps?q='+encodeURIComponent(q)+'&output=embed'}
function nav(q){window.open(gmaps(q),'_blank','noopener')}
function setView(v){view=v;render()}
function render(){document.querySelectorAll('.toolbar button').forEach(b=>b.classList.toggle('primary',b.id===view+'Btn'));$('days').innerHTML=view==='overview'?state.days.map((d,i)=>`<button class="${i===day?'active':''}" onclick="day=${i};render()">D${i+1} · ${d.date.slice(5)}</button>`).join(''):'';if(view==='overview')renderDay();else if(view==='booking')renderBookings();else if(view==='history')renderHistory();else renderSettings()}
function renderDay(){const d=state.days[day];$('content').innerHTML=`<section class="panel"><h2>Day ${day+1} · ${esc(d.date)}</h2><p>${esc(d.headline)}</p><div class="meta">交通：${esc(d.transport)} ｜ 酒店：${esc(d.hotel)}</div>${day===3?'<div class="warn">太鲁阁台8线实行动态交通管制。不要依据旧手册认定道路开放，出发前必须查询官方实时公告。</div>':''}${day===4?'<div class="warn">三仙台八拱桥施工封闭，保留海岸观景，不安排过桥。</div>':''}${day===5||day===7?'<div class="warn">本日原计划交通时间过紧，仍需按真实路况重排。</div>':''}<div class="actions"><button onclick="addStop()">＋ 添加行程</button><button onclick="nav('${esc(d.hotel)} 台湾')">酒店地图</button><a href="https://168.thb.gov.tw/" target="_blank" rel="noopener">公路实时资讯</a></div></section><section class="panel"><h3>逐站安排 · 点击文字可编辑</h3>${d.stops.map((s,i)=>`<div class="stop"><div><input class="edit time" aria-label="时间" value="${esc(s.time)}" onchange="edit(${i},'time',this.value)"></div><div><textarea class="edit" aria-label="行程内容" onchange="edit(${i},'title',this.value)">${esc(s.title)}</textarea><div class="actions"><select class="edit" style="width:auto" onchange="edit(${i},'status',this.value)">${['无需预订','未预订','已预订','待确认','已取消'].map(x=>`<option ${x===s.status?'selected':''}>${x}</option>`).join('')}</select><button onclick="nav(state.days[day].stops[${i}].title)">地图 ↗</button><button onclick="removeStop(${i})">删除</button></div><input class="edit" placeholder="备注、订票号或确认事项" value="${esc(s.note)}" onchange="edit(${i},'note',this.value)"></div></div>`).join('')}</section><section class="panel"><h3>当天地图</h3><iframe class="map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="${mapFrame(d.hotel+' 台湾')}"></iframe><p class="small">内嵌地图用于查看位置；驾驶时请使用上面的 Google Maps 链接打开实时导航。</p></section>`}
function edit(i,k,v){state.days[day].stops[i][k]=v;save('D'+(day+1)+' 修改 '+k+'：'+v.slice(0,35))}function addStop(){state.days[day].stops.push({time:'',title:'新增地点',status:'未预订',note:''});save('D'+(day+1)+' 添加行程')}function removeStop(i){if(confirm('删除这个行程？')){state.days[day].stops.splice(i,1);save('D'+(day+1)+' 删除行程')}}
function renderBookings(){let a=[];state.days.forEach((d,i)=>d.stops.forEach((s,j)=>{if(s.status!=='无需预订')a.push({d,i,j,s})}));$('content').innerHTML=`<section class="panel"><h2>预订事项</h2><p class="meta">酒店与机票已订（来自原手册及你的确认）。火车、租车、跟团仍需核实和预订。</p><div class="warn">建议11月13日核查并购买12月12日台北→花莲台铁车票；11月18日核查12月16日左营→台北高铁车票。预售日期以官方系统为准。</div>${a.map(x=>`<div class="history"><b>D${x.i+1} ${esc(x.d.date)}</b> · ${esc(x.s.title)}<br><span class="status">${esc(x.s.status)}</span><button onclick="day=${x.i};setView('overview')">查看 / 修改</button></div>`).join('')}</section>`}
function renderHistory(){$('content').innerHTML=`<section class="panel"><h2>修改历史</h2><p class="small">保存最近100个本地/云端快照。恢复操作也会留下记录。</p>${state.history.map((h,i)=>`<div class="history"><b>${esc(new Date(h.at).toLocaleString())}</b><p>${esc(h.action)}</p><button onclick="restore(${i})">恢复此版本</button></div>`).join('')||'尚无修改记录'}</section>`}function restore(i){if(!confirm('恢复这个版本？当前版本会先保存到历史。'))return;const old=JSON.parse(state.history[i].snapshot);state.days=old;save('恢复历史版本 '+state.history[i].at)}
function renderSettings(){$('content').innerHTML=`<section class="panel"><h2>云端同步设置</h2><p>需要你自己的 Supabase 项目。注意：旅行访问码不是安全登录凭据；不要在未配置身份验证和访问控制的情况下公开数据库。</p><label>Supabase Project URL<input id="url" class="edit" value="${esc(cloudConfig?.url||'')}" placeholder="https://xxxxx.supabase.co"></label><label>Publishable / anon key<input id="key" class="edit" value="${esc(cloudConfig?.key||'')}" placeholder="公开客户端 key（不要使用 service_role key）"></label><label>旅行访问码<input id="code" class="edit" value="${esc(cloudConfig?.code||'')}" placeholder="私有旅行代号"></label><button class="primary" onclick="configure()">保存并连接</button><hr><button onclick="exportData()">导出完整备份 JSON</button><label>导入备份<input type="file" accept="application/json" onchange="importData(this)"></label><p class="small">目前版本提供离线本机编辑与可选云端同步基础功能。多人安全协作需进一步配置 Supabase Auth + RLS。</p></section>`}
function configure(){cloudConfig={url:$('url').value.trim(),key:$('key').value.trim(),code:$('code').value.trim()};localStorage.setItem('taiwan-cloud-config',JSON.stringify(cloudConfig));initCloud()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='taiwan-trip-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}function importData(el){let f=el.files[0];if(!f)return;f.text().then(t=>{let v=JSON.parse(t);if(!Array.isArray(v.days)||!Array.isArray(v.history))throw Error('备份格式错误');state=v;save('导入备份')}).catch(e=>alert(e.message))}
['overview','booking','history','settings'].forEach(v=>$(v+'Btn').onclick=()=>setView(v));render();initCloud();
</script></body></html>
