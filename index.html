<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c4a"><title>台湾家庭旅行 · 2026</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans SC',sans-serif;color:#17323c;background:#f4f8f7}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#123c4a,#1d746c);color:white;padding:28px max(18px,calc((100vw - 1050px)/2))}h1{margin:0;font-size:27px}header p{opacity:.85}main{max-width:1050px;margin:auto;padding:16px}.toolbar,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button,input,textarea,select{font:inherit}button{border:1px solid #b9cece;border-radius:10px;background:white;color:#134d50;padding:9px 13px;cursor:pointer}.active,.primary{background:#166c68;color:white;border-color:#166c68}.panel{background:white;border:1px solid #d9e6e3;border-radius:16px;padding:18px;margin:15px 0;box-shadow:0 4px 18px #193b4110}.meta{color:#57747b;font-size:13px}.stop{padding:13px 0;border-bottom:1px solid #e4eded;display:grid;grid-template-columns:70px 1fr;gap:8px}.stop:last-child{border:0}.time{font-weight:700;color:#166c68}.edit{width:100%;padding:8px;border:1px solid #cadbd9;border-radius:8px;margin:5px 0;background:#fff}.stop textarea{min-height:70px;resize:vertical}.status{font-size:12px;background:#eef5f4;border-radius:20px;padding:4px 9px;display:inline-block}.warn{border-left:4px solid #dc9a37;background:#fff8e8;padding:10px;margin:10px 0;font-size:14px}.map{width:100%;height:300px;border:0;border-radius:12px}.small{font-size:12px;color:#647a7c}.history{border-bottom:1px solid #e4eded;padding:10px 0}.hidden{display:none}a{color:#126d77}#banner{font-size:13px} @media(max-width:600px){header{padding:22px 18px}h1{font-size:23px}.stop{grid-template-columns:53px 1fr}.panel{padding:13px}.map{height:260px}}
 .readonly input,.readonly textarea,.readonly select{pointer-events:none;background:#f3f7f6}.readonly .owner-only{display:none} .loginbox{display:grid;gap:9px;max-width:420px} .loginbox input{padding:10px;border:1px solid #ccd;border-radius:8px} </style></head><body><header><h1>台湾 · 9天家庭旅行</h1><p>2026.12.09 — 12.17 ｜台北 · 花莲 · 台东 · 垦丁 · 高雄</p><div id="banner">加载中…</div></header><main><div class="toolbar"><button id="overviewBtn" class="primary">每日行程</button><button id="bookingBtn">订票清单</button></div><div id="days" class="tabs"></div><div id="content"></div></main>
<script>
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const maps=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const frame=q=>'https://maps.google.com/maps?q='+encodeURIComponent(q)+'&output=embed';
let days=[],day=0,view='overview';
function render(){
 $('days').innerHTML=view==='overview'?days.map((d,i)=>`<button class="${i===day?'active':''}" data-day="${i}">D${i+1} · ${esc(d.date.slice(5))}</button>`).join(''):'';
 document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=+b.dataset.day;render()});
 $('overviewBtn').classList.toggle('primary',view==='overview');
 $('bookingBtn').classList.toggle('primary',view==='booking');
 if(view==='overview')renderDay();else renderBookings();
}
function renderDay(){
 const d=days[day];
 $('content').innerHTML=`<section class="panel"><h2>Day ${esc(d.day)} · ${esc(d.date)}</h2><p>${esc(d.headline)}</p><div class="meta">交通：${esc(d.transport)} ｜ 酒店：${esc(d.hotel)}</div>${day===3?'<div class="warn">太鲁阁与清水断崖周边道路须出发前查询官方公告，不能保证通行。</div>':''}${day===4?'<div class="warn">三仙台八拱桥施工期间不可跨桥登岛；本日时刻表仍待优化。</div>':''}${day===5||day===7?'<div class="warn">原计划行车时间偏紧，尚待重新安排。</div>':''}<div class="actions"><a href="${maps(d.hotel+' 台湾')}" target="_blank" rel="noopener">酒店地图 ↗</a><a href="https://168.thb.gov.tw/" target="_blank" rel="noopener">公路实时资讯 ↗</a></div></section><section class="panel"><h3>逐站安排</h3>${d.stops.map(s=>`<div class="stop"><div class="time">${esc(s.time)}</div><div><div>${esc(s.title)}</div><div class="actions"><span class="status">${esc(s.status)}</span><a target="_blank" rel="noopener" href="${maps(s.title)}">Google 地图 ↗</a></div>${s.note?`<div class="small">${esc(s.note)}</div>`:''}</div></div>`).join('')}</section><section class="panel"><h3>当天地图</h3><iframe class="map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="${frame(d.hotel+' 台湾')}"></iframe><p class="small">点击每站的 Google 地图可打开定位和导航。</p></section>`;
}
function renderBookings(){
 let a=[];days.forEach((d,i)=>d.stops.forEach(s=>{if(s.status!=='无需预订')a.push({d,i,s})}));
 $('content').innerHTML=`<section class="panel"><h2>待办与订票</h2><p class="meta">酒店预订状态以实际订单为准；不公开私人订单信息。</p><div class="warn">台铁、高铁车票请按官方开售时间核实；租车异地还车需确认。</div>${a.map(x=>`<div class="history"><b>D${x.i+1} ${esc(x.d.date)}</b> · ${esc(x.s.title)}<p class="status">${esc(x.s.status)}</p></div>`).join('')}</section>`;
}
$('overviewBtn').onclick=()=>{view='overview';render()};
$('bookingBtn').onclick=()=>{view='booking';render()};
(async()=>{
 try{
  const response=await fetch('./data.json?updated='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw Error('HTTP '+response.status);
  const data=await response.json();
  days=Array.isArray(data)?data:data.days;
  if(!Array.isArray(days)||!days.length)throw Error('行程数据格式不正确');
  $('banner').textContent='行程已更新 · 公开查看 · 无需登录';
  render();
 }catch(e){$('banner').textContent='行程读取失败：'+e.message;$('content').innerHTML='<section class="panel">请稍后刷新网页。</section>'}
})();
</script></body></html>
