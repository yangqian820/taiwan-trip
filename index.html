 const d=days[day];
 $('content').innerHTML=`<section class="panel"><h2>Day ${esc(d.day)} · ${esc(d.date)}</h2><p>${esc(d.headline)}</p><div class="meta">交通：${esc(d.transport)} ｜ 酒店：${esc(d.hotel)}</div><p class="day-desc">${esc(GUIDE.dayNotes[day][0])}</p>${day===3?'<div class="warn">太鲁阁与清水断崖周边道路须出发前查询官方公告，不能保证通行。</div>':''}${day===4?'<div class="warn">三仙台八拱桥施工期间不可跨桥登岛；本日时刻表仍待优化。</div>':''}${day===5||day===7?'<div class="warn">原计划行车时间偏紧，尚待重新安排。</div>':''}<div class="actions"><a href="${maps(d.hotel+' 台湾')}" target="_blank" rel="noopener">酒店地图 ↗</a><a href="https://168.thb.gov.tw/" target="_blank" rel="noopener">公路实时资讯 ↗</a></div></section><section class="panel"><h3>逐站安排</h3>${d.stops.map(s=>`<div class="stop"><div class="time">${esc(s.time)}</div><div><div>${esc(s.title)}</div><div class="actions"><span class="status">${esc(s.status)}</span><a target="_blank" rel="noopener" href="${maps(s.place||s.title)}">Google 地图 ↗</a></div>${s.note?`<div class="small">${esc(s.note)}</div>`:''}</div></div>`).join('')}</section>${day===0?"<section class=\"panel\"><h3>📸 第一天景点照片与必看介绍（总统府／自由广场／中正纪念堂／四四南村／101）</h3><p class=\"small\">按当天顺序排列，突出必看、适合拍照的位置和建议停留时间。照片仅供参考；如图片无法加载，请点击每张卡片下方的地图及实景照片查看。</p><div class=\"compact-grid\"><article><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Presidential%20Office%20Building%2C%20Taipei.jpg\" alt=\"总统府外观实景参考\" loading=\"lazy\" style=\"width:100%;height:165px;object-fit:cover;border-radius:9px\" onerror=\"this.style.display='none'\"><h4>总统府外观</h4><p class=\"small\"><b>10–15分钟 · 可跳过</b></p><p class=\"small\">红砖与白色石材的历史建筑，中央高塔最醒目。必看正面全景，路过拍照即可，不安排内部参观。</p><a href=\"https://www.google.com/maps/search/?api=1&query=%E5%8F%B0%E5%8C%97%E7%B8%BD%E7%B5%B1%E5%BA%9C\" target=\"_blank\" rel=\"noopener\">地图及实景照片 ↗</a></article><article><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Liberty%20Square%20Taipei.jpg\" alt=\"自由广场实景参考\" loading=\"lazy\" style=\"width:100%;height:165px;object-fit:cover;border-radius:9px\" onerror=\"this.style.display='none'\"><h4>自由广场</h4><p class=\"small\"><b>15–20分钟 · 推荐</b></p><p class=\"small\">看白色自由广场牌楼、国家戏剧院和音乐厅。必拍：从牌楼方向望向中正纪念堂的对称广场景观。</p><a href=\"https://www.google.com/maps/search/?api=1&query=%E8%87%AA%E7%94%B1%E5%BB%A3%E5%A0%B4%20%E5%8F%B0%E5%8C%97\" target=\"_blank\" rel=\"noopener\">地图及实景照片 ↗</a></article><article><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Chiang%20Kai-shek%20Memorial%20Hall.jpg\" alt=\"中正纪念堂实景参考\" loading=\"lazy\" style=\"width:100%;height:165px;object-fit:cover;border-radius:9px\" onerror=\"this.style.display='none'\"><h4>中正纪念堂</h4><p class=\"small\"><b>30–45分钟 · 上午重点</b></p><p class=\"small\">蓝色八角屋顶、白色纪念堂、宽阔阶梯和历史展陈。可关注整点仪队展示，但时间、地点及雨天安排须以当天公告为准。</p><a href=\"https://www.google.com/maps/search/?api=1&query=%E4%B8%AD%E6%AD%A3%E7%B4%80%E5%BF%B5%E5%A0%82\" target=\"_blank\" rel=\"noopener\">地图及实景照片 ↗</a></article><article><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Four%20Four%20South%20Village.jpg\" alt=\"四四南村实景参考\" loading=\"lazy\" style=\"width:100%;height:165px;object-fit:cover;border-radius:9px\" onerror=\"this.style.display='none'\"><h4>四四南村</h4><p class=\"small\"><b>20–30分钟 · 推荐拍照</b></p><p class=\"small\">旧眷村低矮房屋与后方101高楼形成反差。必拍：从老房屋前拍到101；适合轻松走走，不必停留太久。</p><a href=\"https://www.google.com/maps/search/?api=1&query=%E5%9B%9B%E5%9B%9B%E5%8D%97%E6%9D%91%20%E5%8F%B0%E5%8C%97\" target=\"_blank\" rel=\"noopener\">地图及实景照片 ↗</a></article><article><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Taipei%20101%20from%20below.jpg\" alt=\"台北101外观实景参考\" loading=\"lazy\" style=\"width:100%;height:165px;object-fit:cover;border-radius:9px\" onerror=\"this.style.display='none'\"><h4>台北101外观</h4><p class=\"small\"><b>15–25分钟 · 推荐</b></p><p class=\"small\">台湾代表性地标，建筑外观有竹节层叠意象。必看整栋楼的轮廓；你们不必上观景台，接着到地下楼层买伴手礼。</p><a href=\"https://www.google.com/maps/search/?api=1&query=%E5%8F%B0%E5%8C%97101\" target=\"_blank\" rel=\"noopener\">地图及实景照片 ↗</a></article></div><p class=\"small\">上午取舍：时间不够时优先自由广场与中正纪念堂，总统府外观可略过。下午四四南村＋101外观一起安排，之后再买伴手礼。</p></section>":''}"<section class=\"panel\"><h3>🍍 第一天亲子美食与购物图文推荐</h3><p class=\"small\">以吃的、凤梨酥和12岁／8岁孩子喜欢的文具小礼物为主；不安排手办、动漫周边。图片为店铺或商品环境参考，实际柜位和货品以现场为准。</p><div class=\"compact-grid\"><article><img src=\"https://ak-d.tripcdn.com/images/1mi192215f9p1pgj5CAC9_W_640_0_R5_Q80.jpg\" alt=\"台北101 B1｜微热山丘＋糖村\" loading=\"lazy\" style=\"width:100%;height:165px;object-fit:cover;border-radius:9px\" onerror=\"this.style.display='none'\"><span class=\"pill\">🍍 必逛</span><h4>台北101 B1｜微热山丘＋糖村</h4><p class=\"small\">凤梨酥、牛轧糖、饼干；先试口味、少量买，返程前再补货。101不必逛精品楼层。</p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.taipei-101.com.tw/tw/shopping/point\">查看店铺资讯 ↗</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&query=%E5%8F%B0%E5%8C%97101%20%E5%BE%AE%E7%86%B1%E5%B1%B1%E4%B8%98\">地图 ↗</a></article><article><img src=\"https://knott.jp/toku69/wp-content/uploads/2021/03/4F_232.jpg\" alt=\"新光三越信义 A8｜儿童楼层＋B2美食\" loading=\"lazy\" style=\"width:100%;height:165px;object-fit:cover;border-radius:9px\" onerror=\"this.style.display='none'\"><span class=\"pill\">🧸 孩子可选</span><h4>新光三越信义 A8｜儿童楼层＋B2美食</h4><p class=\"small\">适合8岁与12岁孩子看看文具、小礼物、生活杂货；B2可以吃点心。逛20–40分钟即可，不买动漫手办。</p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.skm.com.tw/FloorInfo?request_locale=en_US\">查看店铺资讯 ↗</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&query=%E6%96%B0%E5%85%89%E4%B8%89%E8%B6%8A%E4%BF%A1%E7%BE%A9A8\">地图 ↗</a></article><article><img src=\"https://kiann.jx-starlux.com/uploads/69ba08194114350a2baf23dcdfed2ad2.jpg\" alt=\"诚品生活松菸｜文具、贴纸、笔记本\" loading=\"lazy\" style=\"width:100%;height:165px;object-fit:cover;border-radius:9px\" onerror=\"this.style.display='none'\"><span class=\"pill\">✏️ 文具重点（备选）</span><h4>诚品生活松菸｜文具、贴纸、笔记本</h4><p class=\"small\">文具种类比一般百货更丰富，有设计文具、胶带、贴纸、笔记本；但不在101旁，第一天疲劳时不要特意绕路，可留到其他天。</p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.travel.taipei/file/35230/\">查看店铺资讯 ↗</a> · <a target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&query=%E8%AA%A0%E5%93%81%E7%94%9F%E6%B4%BB%E6%9D%BE%E8%8F%B8\">地图 ↗</a></article></div><p class=\"warn\">建议只选101 B1和A8两站；诚品松菸为备选，不必为了购物推迟19:00回酒店。</p></section>":''}<section class="panel"><h3>当天地图</h3>${day===0?'<p>第一天全路线：机场 → 西门酒店寄存行李 → 阜杭豆浆 → 中正纪念堂 → 金峰卤肉饭 → 四四南村／101 → Simple Kaffa → 提前晚餐 → 西门红楼（可选） → 酒店。</p><p class="warn">已将四四南村定位改为有街道地址的「好丘信义店」（位于四四南村）。多站路线使用驾车模式仅为显示站点顺序，不代表建议全程开车；实际搭乘捷运或步行请逐段选择交通方式。</p><div class="actions"><a target="_blank" rel="noopener" href="'+directions(day1Route)+'">打开全日路线 ↗</a><a target="_blank" rel="noopener" href="'+directions(day1Route.slice(0,6))+'">上午路线 ↗</a><a target="_blank" rel="noopener" href="'+directions(day1Route.slice(5))+'">下午路线 ↗</a></div><iframe class="map" style="height:440px" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="'+routeEmbed(day1Route.slice(1))+'"></iframe><p class="small">如嵌入地图无法显示多站路线，请使用上方上午／下午分段路线链接；实际以 Google 地图导航为准。</p>':'<iframe class="map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="'+frame(d.hotel+' 台湾')+'"></iframe><p class="small">点击每站的 Google 地图可打开定位和导航。</p>'}</section>`;
}
function renderGuide(){
 const names={prep:'出发前准备',hotels:'住宿与取消政策',food:'美食速查表',shopping:'购物与伴手礼',driving:'自驾与实用信息'};
 const title=names[view];
 const a=GUIDE[view];
 if(view==='hotels'){
  $('content').innerHTML='<section class="panel"><h2>'+title+'</h2><p class="warn">以下取消时间与条款摘自原手册，均为台湾当地时间。请以实际预订确认邮件及酒店政策为准。公开页面不包含订单号、PIN、联系方式或信用卡信息。</p>'+a.map(x=>'<div class="info-item"><b>'+esc(x[1])+'</b> <span class="pill">'+esc(x[2])+'</span><p>'+esc(x[0])+' · '+esc(x[3])+'</p><p><b>取消政策：</b>'+esc(x[4])+'</p><p class="small">'+esc(x[5])+'</p></div>').join('')+'</section>';return;
 }
 $('content').innerHTML='<section class="panel"><h2>'+title+'</h2>'+(view==='shopping'?'<p class="small">手册建议 Day1 先在信义商圈购买部分伴手礼，Day8 在永康街／南西商圈补齐；佳德和微热山丘不必重复大量采购。</p>':'')+a.map(x=>'<div class="info-item"><b>'+esc(x[0])+'</b><p>'+esc(x[1])+'</p>'+(x[2]?'<p class="small">'+esc(x[2])+'</p>':'')+'</div>').join('')+'</section>';
}
function renderBookings(){
 let a=[];days.forEach((d,i)=>d.stops.forEach(s=>{if(s.status!=='无需预订')a.push({d,i,s})}));
 $('content').innerHTML=`<section class="panel"><h2>待办与订票</h2><p class="meta">酒店预订状态以实际订单为准；不公开私人订单信息。</p><div class="warn">台铁、高铁车票请按官方开售时间核实；租车异地还车需确认。</div>${GUIDE.bookings.map(x=>`<div class="history"><b>${esc(x[0])}</b><p class="small">${esc(x[1])}</p><p class="small">办理渠道：${esc(x[2])}</p><span class="status">${esc(x[3])}</span></div>`).join('')}${a.map(x=>`<div class="history"><b>D${x.i+1} ${esc(x.d.date)}</b> · ${esc(x.s.title)}<p class="status">${esc(x.s.status)}</p></div>`).join('')}</section>`;
}
$('overviewBtn').onclick=()=>{view='overview';render()};
$('bookingBtn').onclick=()=>{view='booking';render()};
['prep','hotels','food','shopping','driving'].forEach(v=>$(v+'Btn').onclick=()=>{view=v;render()});
(async()=>{
 try{
  const response=await fetch('./data.json?updated='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw Error('HTTP '+response.status);
  const data=await response.json();
  days=Array.isArray(data)?data:data.days;
  if(!Array.isArray(days)||!days.length)throw Error('行程数据格式不正确');
  $('banner').textContent='行程已更新 · 公开查看 · 无需登录';
  render();
 }catch(e){$('banner').textContent='行程读取失败：'+e.message;$('content').innerHTML='<section class="panel">请稍后刷新网页。</section>'}
})();
</script></body></html>
